<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Чики Пуки Соцсеть | Realtime</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 700px; margin: 0 auto; padding: 1rem; background: #f0f2f5; }
        .chat-list { background: white; border-radius: 16px; padding: 0.5rem; margin-bottom: 1rem; }
        .chat-item { padding: 0.75rem; border-bottom: 1px solid #e0e0e0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .chat-item:hover { background: #f5f5f5; }
        .chat-name { font-weight: bold; flex: 1; }
        .chat-delete { color: red; cursor: pointer; font-size: 1.2rem; padding: 0 0.5rem; }
        .messages-area { background: white; border-radius: 16px; padding: 1rem; margin-bottom: 1rem; height: 400px; overflow-y: auto; }
        .message { padding: 0.5rem; margin: 0.5rem 0; border-radius: 12px; background: #e3f2fd; }
        .message-own { background: #c8e6c9; text-align: right; }
        .message-author { font-weight: bold; font-size: 0.85rem; color: #1e88e5; }
        .message-text { margin: 0.25rem 0; word-wrap: break-word; }
        .message-time { font-size: 0.7rem; color: #666; }
        .delete-msg { color: red; cursor: pointer; font-size: 0.7rem; margin-left: 0.5rem; }
        .input-area { background: white; border-radius: 16px; padding: 1rem; position: sticky; bottom: 0; }
        textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 12px; font-family: inherit; font-size: 1rem; resize: vertical; }
        button { background: #1e88e5; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 24px; cursor: pointer; font-size: 0.9rem; margin-top: 0.5rem; margin-right: 0.5rem; }
        button.danger { background: #dc3545; }
        button.secondary { background: #6c757d; }
        .login-box { background: white; border-radius: 24px; padding: 2rem; max-width: 400px; margin: 2rem auto; }
        input { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 12px; }
        .user-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0.5rem; background: white; border-radius: 12px; }
        .current-chat-title { font-weight: bold; margin: 0.5rem 0; padding: 0.5rem; background: #e3f2fd; border-radius: 12px; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ========== ВАШ КОНФИГ FIRESTBASE ==========
    // ⚠️ ТОЛЬКО ЗАМЕНИТЕ databaseURL НА ВАШУ ССЫЛКУ ⚠️
    const firebaseConfig = {
        apiKey: "AIzaSyB8hzWpEGjE_hxZBhO-uTzJQ6oG_dPCD9I",  // Оставьте как есть (публичный ключ из вашего проекта)
        authDomain: "network-6c0e9.firebaseapp.com",
        databaseURL: "https://network-6c0e9-default-rtdb.europe-west1.firebasedatabase.app/",  // 👈 ВСТАВЬТЕ ВАШУ ССЫЛКУ
        projectId: "network-6c0e9",
        storageBucket: "network-6c0e9.appspot.com",
        messagingSenderId: "1076128387905",
        appId: "1:1076128387905:web:94b18e2e21454ca47fd1e1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentUser = null;
    let currentChatId = null;
    let messagesListener = null;

    // Регистрация
    async function register() {
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const name = document.getElementById('regName').value;
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, pass);
            await cred.user.updateProfile({ displayName: name });
            alert('Регистрация успешна!');
        } catch(e) { alert('Ошибка: ' + e.message); }
    }

    // Вход
    async function login() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        try {
            await auth.signInWithEmailAndPassword(email, pass);
        } catch(e) { alert('Ошибка: ' + e.message); }
    }

    function logout() { auth.signOut(); }

    // Создать чат
    async function createChat() {
        const name = prompt('Название чата:');
        if (!name) return;
        const chatRef = db.ref('chats').push();
        await chatRef.set({
            name: name,
            createdBy: currentUser.uid,
            createdAt: Date.now()
        });
        renderApp();
    }

    // Удалить чат
    async function deleteChat(chatId, chatName) {
        if (!confirm(`Удалить чат "${chatName}"?`)) return;
        await db.ref(`chats/${chatId}`).remove();
        await db.ref(`messages/${chatId}`).remove();
        if (currentChatId === chatId) currentChatId = null;
        renderApp();
    }

    // Отправить сообщение
    async function sendMessage() {
        const text = document.getElementById('messageText')?.value;
        if (!text?.trim()) return;
        await db.ref(`messages/${currentChatId}`).push({
            text: text.trim(),
            authorId: currentUser.uid,
            authorName: currentUser.displayName || currentUser.email,
            timestamp: Date.now()
        });
        document.getElementById('messageText').value = '';
        setTimeout(() => {
            const container = document.getElementById('messagesContainer');
            if (container) container.scrollTop = container.scrollHeight;
        }, 100);
    }

    // Удалить своё сообщение
    async function deleteMessage(chatId, msgId, authorId) {
        if (authorId !== currentUser.uid) return;
        await db.ref(`messages/${chatId}/${msgId}`).remove();
    }

    // Удалить все свои сообщения
    async function deleteMyMessages() {
        if (!confirm('Удалить все свои сообщения?')) return;
        const msgsRef = db.ref(`messages/${currentChatId}`);
        const snapshot = await msgsRef.get();
        const updates = {};
        snapshot.forEach(msg => {
            if (msg.val().authorId === currentUser.uid) {
                updates[msg.key] = null;
            }
        });
        await msgsRef.update(updates);
    }

    // Очистить весь чат (только создатель)
    async function clearWholeChat() {
        const chatRef = db.ref(`chats/${currentChatId}`);
        const snap = await chatRef.get();
        if (snap.val().createdBy !== currentUser.uid) {
            alert('Только создатель чата может очистить все сообщения');
            return;
        }
        if (!confirm('Очистить ВСЕ сообщения?')) return;
        await db.ref(`messages/${currentChatId}`).remove();
    }

    // Выбрать чат
    function joinChat(chatId) {
        if (messagesListener) messagesListener();
        currentChatId = chatId;
        renderApp();
    }

    // Отрисовка
    function renderApp() {
        const app = document.getElementById('app');
        if (!currentUser) {
            app.innerHTML = `
                <div class="login-box">
                    <h2>🔐 Вход</h2>
                    <input id="loginEmail" placeholder="Email"><br>
                    <input id="loginPass" placeholder="Пароль" type="password"><br>
                    <button onclick="login()">Войти</button>
                    <hr>
                    <h3>📝 Регистрация</h3>
                    <input id="regName" placeholder="Ваше имя"><br>
                    <input id="regEmail" placeholder="Email"><br>
                    <input id="regPass" placeholder="Пароль" type="password"><br>
                    <button onclick="register()">Создать аккаунт</button>
                </div>
            `;
            return;
        }

        app.innerHTML = `
            <div class="user-info">
                <span>👤 ${escapeHtml(currentUser.displayName || currentUser.email)}</span>
                <button onclick="logout()" class="secondary">Выйти</button>
            </div>
            <button onclick="createChat()">➕ Новый чат</button>
            <div id="chatsList"></div>
            <div id="chatArea">
                ${currentChatId ? `
                    <div class="current-chat-title">
                        <div id="chatTitle"></div>
                        <div style="margin-top: 10px;">
                            <button onclick="deleteMyMessages()" class="danger">🗑️ Мои сообщения</button>
                            <button onclick="clearWholeChat()" class="danger">⚠️ Очистить чат</button>
                        </div>
                    </div>
                    <div id="messagesContainer" class="messages-area"></div>
                    <div class="input-area">
                        <textarea id="messageText" placeholder="Сообщение..." rows="2"></textarea>
                        <button onclick="sendMessage()">📤 Отправить</button>
                    </div>
                ` : '<div style="text-align:center;padding:2rem;">✨ Выберите чат слева ✨</div>'}
            </div>
        `;

        // Список чатов
        db.ref('chats').on('value', (snapshot) => {
            const chatsDiv = document.getElementById('chatsList');
            if (!chatsDiv) return;
            let html = '<div class="chat-list">';
            snapshot.forEach(child => {
                const chat = child.val();
                html += `
                    <div class="chat-item">
                        <div class="chat-name" onclick="joinChat('${child.key}')">💬 ${escapeHtml(chat.name)}</div>
                        <div class="chat-delete" onclick="deleteChat('${child.key}', '${escapeHtml(chat.name)}')">🗑️</div>
                    </div>
                `;
            });
            html += '</div>';
            chatsDiv.innerHTML = html || '<p>Нет чатов. Создайте первый!</p>';
        });

        // Сообщения и название чата
        if (currentChatId) {
            db.ref(`chats/${currentChatId}`).once('value', (snap) => {
                const titleDiv = document.getElementById('chatTitle');
                if (titleDiv) titleDiv.innerHTML = `📢 ${escapeHtml(snap.val()?.name || 'Чат')}`;
            });

            if (messagesListener) messagesListener();
            const msgsRef = db.ref(`messages/${currentChatId}`);
            messagesListener = msgsRef.on('value', (snapshot) => {
                const container = document.getElementById('messagesContainer');
                if (!container) return;
                let html = '';
                const msgs = [];
                snapshot.forEach(child => msgs.push({ id: child.key, ...child.val() }));
                msgs.sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0));
                msgs.forEach(msg => {
                    const isOwn = msg.authorId === currentUser.uid;
                    html += `
                        <div class="message ${isOwn ? 'message-own' : ''}">
                            <div class="message-author">${escapeHtml(msg.authorName)}</div>
                            <div class="message-text">${escapeHtml(msg.text)}</div>
                            <div class="message-time">
                                ${new Date(msg.timestamp).toLocaleString()}
                                ${isOwn ? `<span class="delete-msg" onclick="deleteMessage('${currentChatId}', '${msg.id}', '${msg.authorId}')">[удалить]</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || '<div style="text-align:center;color:#999;">Нет сообщений</div>';
                container.scrollTop = container.scrollHeight;
            });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.createChat = createChat;
    window.deleteChat = deleteChat;
    window.joinChat = joinChat;
    window.sendMessage = sendMessage;
    window.deleteMessage = deleteMessage;
    window.deleteMyMessages = deleteMyMessages;
    window.clearWholeChat = clearWholeChat;
    window.login = login;
    window.register = register;
    window.logout = logout;

    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (!user) currentChatId = null;
        renderApp();
    });
</script>
</body>
</html>
