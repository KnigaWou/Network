<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Network</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; background: #e8eef4; height: 100vh; display: flex; flex-direction: column; }
        
        /* Шапка как в Telegram */
        .header { background: #2a6b9e; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .header h1 { font-size: 1.2rem; font-weight: 600; flex: 1; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        
        /* Основной контейнер */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Боковая панель (чаты + онлайн) */
        .sidebar { width: 300px; background: white; display: flex; flex-direction: column; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
        @media (max-width: 600px) { .sidebar { width: 80px; } .sidebar .chat-name, .sidebar .online-name { display: none; } }
        
        /* Онлайн блок */
        .online-section { padding: 12px; border-bottom: 1px solid #eee; background: #f8f9fa; }
        .online-title { font-size: 0.75rem; text-transform: uppercase; color: #666; margin-bottom: 8px; font-weight: 600; }
        .online-user { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; border-radius: 12px; transition: background 0.1s; }
        .online-user:hover { background: #eef2f5; }
        .online-dot { width: 10px; height: 10px; background: #31a24c; border-radius: 50%; flex-shrink: 0; }
        .online-name { font-size: 0.85rem; flex: 1; color: #333; }
        .invite-small { background: #e1ecf4; border: none; padding: 2px 8px; border-radius: 16px; font-size: 0.7rem; cursor: pointer; color: #2a6b9e; }
        
        /* Список чатов */
        .chats-section { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px; gap: 10px; cursor: pointer; border-bottom: 1px solid #eee; transition: background 0.1s; }
        .chat-item:hover { background: #f0f4f8; }
        .chat-item.active { background: #e3f0fa; border-left: 3px solid #2a6b9e; }
        .chat-avatar { width: 42px; height: 42px; background: #2a6b9e; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1rem; flex-shrink: 0; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 600; font-size: 0.95rem; color: #111; }
        .chat-last { font-size: 0.7rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 0 4px; }
        .chat-delete:hover { color: #e53935; }
        
        /* Правая панель (чат) */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #f5f7fb; overflow: hidden; }
        .chat-header { padding: 12px 16px; background: white; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .chat-header h3 { font-size: 1rem; font-weight: 600; flex: 1; }
        .clear-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 0.8rem; padding: 4px 8px; border-radius: 8px; }
        .clear-btn:hover { background: #fee; color: #e53935; }
        
        /* Сообщения */
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg { display: flex; flex-direction: column; max-width: 75%; }
        .msg-own { align-self: flex-end; }
        .msg-other { align-self: flex-start; }
        .msg-bubble { padding: 8px 12px; border-radius: 18px; word-wrap: break-word; font-size: 0.9rem; }
        .msg-own .msg-bubble { background: #d3e3f5; color: #111; border-bottom-right-radius: 4px; }
        .msg-other .msg-bubble { background: white; color: #111; border-bottom-left-radius: 4px; box-shadow: 0 1px 1px rgba(0,0,0,0.05); }
        .msg-author { font-size: 0.7rem; font-weight: 600; margin-bottom: 2px; color: #2a6b9e; margin-left: 6px; }
        .msg-time { font-size: 0.6rem; color: #999; margin-top: 2px; margin-left: 6px; }
        .msg-img { max-width: 200px; max-height: 150px; border-radius: 12px; margin-top: 4px; cursor: pointer; }
        .delete-msg { background: none; border: none; color: #bbb; font-size: 0.7rem; cursor: pointer; margin-left: 8px; }
        
        /* Поле ввода */
        .input-wrapper { background: white; padding: 12px 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
        .input-wrapper textarea { flex: 1; border: none; background: #f0f2f5; border-radius: 24px; padding: 10px 16px; font-family: inherit; font-size: 0.9rem; resize: none; max-height: 80px; }
        .input-wrapper textarea:focus { outline: none; background: #e8ecf0; }
        .photo-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 6px; border-radius: 50%; color: #5e8ab3; }
        .send-btn { background: #2a6b9e; border: none; color: white; padding: 8px 20px; border-radius: 24px; cursor: pointer; font-weight: 600; }
        
        /* Логин */
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #2a6b9e, #1a4b6e); padding: 20px; }
        .login-card { background: white; border-radius: 32px; padding: 32px; max-width: 360px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .login-card h2 { margin-bottom: 20px; color: #1a4b6e; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 24px; font-size: 0.9rem; }
        .login-card button { width: 100%; padding: 12px; background: #2a6b9e; color: white; border: none; border-radius: 24px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 12px; }
        .login-card hr { margin: 20px 0; border-color: #eee; }
        
        .empty-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 0.9rem; flex-direction: column; gap: 8px; }
        .create-chat-btn { background: #2a6b9e; color: white; border: none; padding: 8px 16px; border-radius: 24px; cursor: pointer; margin: 8px; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDH0Go3vDMsasjf6unW39UhFklZC4GqPFc",
        authDomain: "network-6c0e9.firebaseapp.com",
        databaseURL: "https://network-6c0e9-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "network-6c0e9",
        storageBucket: "network-6c0e9.firebasestorage.app",
        messagingSenderId: "762011091923",
        appId: "1:762011091923:web:3fe97b0fa4486c0545e526"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const storage = firebase.storage();

    let currentUser = null;
    let currentChatId = null;
    let messagesListener = null;

    // Онлайн-статус
    function setOnline() {
        if (!currentUser) return;
        const ref = db.ref(`online/${currentUser.uid}`);
        ref.set({ name: currentUser.displayName || currentUser.email, online: true, lastSeen: Date.now() });
        ref.onDisconnect().set({ name: currentUser.displayName || currentUser.email, online: false, lastSeen: Date.now() });
    }

    // Сжатие фото
    async function compressAndUpload(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    const max = 800;
                    if (w > max) { h = h * max / w; w = max; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    let quality = 0.7;
                    let dataUrl = canvas.toDataURL('image/jpeg', quality);
                    while (dataUrl.length > 400 * 1024 && quality > 0.3) {
                        quality -= 0.1;
                        dataUrl = canvas.toDataURL('image/jpeg', quality);
                    }
                    const blob = await fetch(dataUrl).then(r => r.blob());
                    const fileName = `${Date.now()}_${file.name}`;
                    const storageRef = storage.ref(`photos/${fileName}`);
                    await storageRef.put(blob);
                    resolve(await storageRef.getDownloadURL());
                };
            };
        });
    }

    // Функции аккаунта
    async function register() {
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const name = document.getElementById('regName').value;
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, pass);
            await cred.user.updateProfile({ displayName: name });
            alert('Готово! Теперь войдите');
        } catch(e) { alert(e.message); }
    }
    async function login() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        try { await auth.signInWithEmailAndPassword(email, pass); } 
        catch(e) { alert(e.message); }
    }
    function logout() { auth.signOut(); location.reload(); }

    // Чаты
    async function createChat() {
        const name = prompt('Название чата:');
        if (!name) return;
        const ref = db.ref('chats').push();
        await ref.set({ name, createdBy: currentUser.uid, createdAt: Date.now(), members: [currentUser.uid] });
    }
    async function deleteChat(id, name) {
        if (!confirm(`Удалить "${name}"?`)) return;
        await db.ref(`chats/${id}`).remove();
        await db.ref(`messages/${id}`).remove();
        if (currentChatId === id) currentChatId = null;
        renderApp();
    }
    async function inviteToChat(userId, userName) {
        if (!currentChatId) { alert('Сначала откройте чат'); return; }
        const chatRef = db.ref(`chats/${currentChatId}`);
        const snap = await chatRef.get();
        const members = snap.val()?.members || [];
        if (members.includes(userId)) { alert(`${userName} уже в чате`); return; }
        members.push(userId);
        await chatRef.update({ members });
        alert(`${userName} приглашён!`);
    }
    async function sendMsg() {
        const text = document.getElementById('msgText')?.value;
        const file = document.getElementById('photoInput')?.files[0];
        if (!text?.trim() && !file) return;
        let photo = null;
        if (file) {
            photo = await compressAndUpload(file);
            document.getElementById('photoInput').value = '';
        }
        await db.ref(`messages/${currentChatId}`).push({
            text: text?.trim() || '',
            photo,
            authorId: currentUser.uid,
            authorName: currentUser.displayName || currentUser.email,
            time: Date.now()
        });
        if (document.getElementById('msgText')) document.getElementById('msgText').value = '';
        setTimeout(() => {
            const m = document.getElementById('messagesContainer');
            if (m) m.scrollTop = m.scrollHeight;
        }, 50);
    }
    async function deleteMsg(chatId, msgId, uid) {
        if (uid !== currentUser.uid) return;
        await db.ref(`messages/${chatId}/${msgId}`).remove();
    }
    async function clearMyMessages() {
        if (!confirm('Удалить все свои сообщения?')) return;
        const snap = await db.ref(`messages/${currentChatId}`).get();
        const updates = {};
        snap.forEach(m => { if (m.val().authorId === currentUser.uid) updates[m.key] = null; });
        await db.ref(`messages/${currentChatId}`).update(updates);
    }
    async function clearAllChat() {
        const chat = (await db.ref(`chats/${currentChatId}`).get()).val();
        if (chat.createdBy !== currentUser.uid) { alert('Только создатель'); return; }
        if (!confirm('Очистить ВСЕ сообщения?')) return;
        await db.ref(`messages/${currentChatId}`).remove();
    }
    function openChat(id) {
        if (messagesListener) messagesListener();
        currentChatId = id;
        renderApp();
    }

    // Рендер
    async function renderApp() {
        const app = document.getElementById('app');
        if (!currentUser) {
            app.innerHTML = `
                <div class="login-screen">
                    <div class="login-card">
                        <h2>✉️ Чики Пуки</h2>
                        <input id="loginEmail" placeholder="Email">
                        <input id="loginPass" placeholder="Пароль" type="password">
                        <button onclick="login()">Войти</button>
                        <hr>
                        <input id="regName" placeholder="Имя">
                        <input id="regEmail" placeholder="Email">
                        <input id="regPass" placeholder="Пароль" type="password">
                        <button onclick="register()">Создать аккаунт</button>
                    </div>
                </div>
            `;
            return;
        }

        app.innerHTML = `
            <div class="header">
                <h1>💬 Чики Пуки</h1>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            <div class="main-container">
                <div class="sidebar">
                    <div class="online-section">
                        <div class="online-title">🟢 В сети</div>
                        <div id="onlineList"></div>
                    </div>
                    <div style="padding: 8px 12px;"><button class="create-chat-btn" onclick="createChat()" style="width:100%">➕ Новый чат</button></div>
                    <div class="chats-section" id="chatsList"></div>
                </div>
                <div class="chat-area">
                    <div id="chatContent"></div>
                </div>
            </div>
        `;

        // Онлайн
        db.ref('online').on('value', (snap) => {
            const div = document.getElementById('onlineList');
            if (!div) return;
            let html = '';
            snap.forEach(ch => {
                const u = ch.val();
                if (u.online === true && ch.key !== currentUser.uid) {
                    html += `<div class="online-user" onclick="inviteToChat('${ch.key}', '${escapeHtml(u.name)}')">
                        <div class="online-dot"></div>
                        <div class="online-name">${escapeHtml(u.name)}</div>
                        <button class="invite-small" style="pointer-events:none;">➕</button>
                    </div>`;
                }
            });
            div.innerHTML = html || '<div style="color:#888; font-size:0.75rem; padding:6px 0;">Никого нет</div>';
        });

        // Список чатов
        db.ref('chats').on('value', (snap) => {
            const div = document.getElementById('chatsList');
            if (!div) return;
            let html = '';
            snap.forEach(ch => {
                const chat = ch.val();
                if (!chat.members?.includes(currentUser.uid)) return;
                html += `<div class="chat-item ${currentChatId === ch.key ? 'active' : ''}" onclick="openChat('${ch.key}')">
                    <div class="chat-avatar">${chat.name.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">${escapeHtml(chat.name)}</div>
                    </div>
                    <button class="chat-delete" onclick="event.stopPropagation(); deleteChat('${ch.key}', '${escapeHtml(chat.name)}')">🗑️</button>
                </div>`;
            });
            div.innerHTML = html || '<div style="padding:16px; text-align:center; color:#888;">Нет чатов</div>';
        });

        // Контент чата
        const chatDiv = document.getElementById('chatContent');
        if (!currentChatId) {
            chatDiv.innerHTML = `<div class="empty-chat"><span>📭</span> Выберите чат или создайте новый</div>`;
            return;
        }

        const chatInfo = (await db.ref(`chats/${currentChatId}`).get()).val();
        chatDiv.innerHTML = `
            <div class="chat-header">
                <h3>${escapeHtml(chatInfo?.name || 'Чат')}</h3>
                <button class="clear-btn" onclick="clearMyMessages()">🗑️ Мои</button>
                <button class="clear-btn" onclick="clearAllChat()">⚠️ Все</button>
            </div>
            <div id="messagesContainer" class="messages"></div>
            <div class="input-wrapper">
                <button class="photo-btn" onclick="document.getElementById('photoInput').click()">📷</button>
                <textarea id="msgText" placeholder="Сообщение..." rows="1"></textarea>
                <button class="send-btn" onclick="sendMsg()">→</button>
                <input type="file" id="photoInput" accept="image/*" style="display:none">
            </div>
        `;

        if (messagesListener) messagesListener();
        const msgsRef = db.ref(`messages/${currentChatId}`);
        messagesListener = msgsRef.on('value', (snap) => {
            const container = document.getElementById('messagesContainer');
            if (!container) return;
            let html = '';
            const arr = [];
            snap.forEach(m => arr.push({ id: m.key, ...m.val() }));
            arr.sort((a,b) => (a.time||0) - (b.time||0));
            arr.forEach(m => {
                const isOwn = m.authorId === currentUser.uid;
                html += `<div class="msg ${isOwn ? 'msg-own' : 'msg-other'}">
                    ${!isOwn ? `<div class="msg-author">${escapeHtml(m.authorName)}</div>` : ''}
                    <div class="msg-bubble">
                        ${m.text ? escapeHtml(m.text) : ''}
                        ${m.photo ? `<img src="${m.photo}" class="msg-img" onclick="window.open('${m.photo}')">` : ''}
                    </div>
                    <div class="msg-time">${new Date(m.time).toLocaleTimeString()} ${isOwn ? `<button class="delete-msg" onclick="deleteMsg('${currentChatId}','${m.id}','${m.authorId}')">✕</button>` : ''}</div>
                </div>`;
            });
            container.innerHTML = html || '<div style="text-align:center;color:#aaa;padding:20px;">Нет сообщений</div>';
            container.scrollTop = container.scrollHeight;
        });

        document.getElementById('msgText')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
        });
    }

    function escapeHtml(s) { return s ? String(s).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])) : ''; }

    window.register = register; window.login = login; window.logout = logout;
    window.createChat = createChat; window.deleteChat = deleteChat; window.openChat = openChat;
    window.sendMsg = sendMsg; window.deleteMsg = deleteMsg; window.clearMyMessages = clearMyMessages;
    window.clearAllChat = clearAllChat; window.inviteToChat = inviteToChat;

    auth.onAuthStateChanged(u => { currentUser = u; if(u) setOnline(); renderApp(); });
</script>
</body>
</html>
